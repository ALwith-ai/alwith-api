[package]
name = "alwith-api"
description = "ALwith from the app side: types of the alwith-runtime-v1 frame protocol, and (feature `client`) a Rust client over a Runtime child's stdio or any byte stream"
version.workspace = true
edition.workspace = true
repository.workspace = true

[features]
default = ["client"]
runtime-contract-tests = ["client"]
client = ["dep:log", "dep:tokio"]

[dependencies]
log = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
# Only for `#[specta(type = Unknown)]`: a JSON value is just `unknown` on the TS side; don't expand
# it into serde_json's internal enum.
specta-typescript = "=0.0.12"
tokio = { version = "1", features = ["full"], optional = true }

[dev-dependencies]
tempfile = "3"
