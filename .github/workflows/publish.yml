# Publish @alwith/api to npm: pushing a v<version> tag publishes it.
#
# Uses npm trusted publishing (OIDC): CI publishes with the identity GitHub issues, so no token is
# stored in the repo or on npmjs,
# and there is no token expiry or npm tightening of 2FA bypass to worry about. Configure it once on
# npmjs.com (see README "Publishing"),
# after which npm login is never needed locally. No --provenance: provenance only supports public
# source repos and this repo is private
# (verified 2026-09-17: E422); add it back the day the repo goes public, so the package page shows
# which commit it came from.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # OIDC: prove to npm "I am publish.yml of ALwith-ai/alwith-api"
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check:api
      - run: bun test packages scripts/__tests__
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust crate from the npm archive
        working-directory: packages/api
        run: |
          bun pm pack --filename "$RUNNER_TEMP/alwith-api.tgz" --quiet
          mkdir -p "$RUNNER_TEMP/alwith-api-unpacked"
          tar -xzf "$RUNNER_TEMP/alwith-api.tgz" -C "$RUNNER_TEMP/alwith-api-unpacked"
          cargo test --manifest-path "$RUNNER_TEMP/alwith-api-unpacked/package/rust/Cargo.toml" --lib
      - name: The tag must equal the version in package.json
        run: |
          version=$(bun -p "require('./packages/api/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME != v$version(packages/api/package.json)"; exit 1
          fi
      # prepack builds the JS dist and the standalone Rust crate; tarball contents are verified by
      # scripts/__tests__.
      - run: bun x --bun npm@latest publish --access public
        working-directory: packages/api
