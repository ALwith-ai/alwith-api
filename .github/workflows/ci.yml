name: ci

# Tests run locally before every push; CI checks pull requests and runs on demand.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check:api
      - run: bun run test
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust crate from the npm archive
        working-directory: packages/api
        run: |
          bun pm pack --filename "$RUNNER_TEMP/alwith-api.tgz" --quiet
          mkdir -p "$RUNNER_TEMP/alwith-api-unpacked"
          tar -xzf "$RUNNER_TEMP/alwith-api.tgz" -C "$RUNNER_TEMP/alwith-api-unpacked"
          cargo test --manifest-path "$RUNNER_TEMP/alwith-api-unpacked/package/rust/Cargo.toml" --lib
